# ┃                    Decorations Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
#
# All theme and environment variables are set in environment.conf.
# This file only manages Hyprland decoration, blur, and shadow settings.
# Colors are sourced from colors.conf for use in decoration variables.

source = ~/.config/hypr/config/colors.conf

# https://wiki.hyprland.org/0.45.0/Configuring/Variables/#decoration

decoration {
    screen_shader = ~/.config/hypr/shaders/cyberpunk-composite.frag
    active_opacity = 1.0
    inactive_opacity = .98
    rounding = 8

    # Subtle inactive dimming - makes focused window pop with neon glow
    dim_inactive = true
    dim_strength = 0.12
    dim_special = 0.3
    dim_around = 0.4

    # https://wiki.hyprland.org/0.45.0/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3         # Minimal blur for performance
        passes = 1       # Single pass - multiple passes are VERY expensive
        noise = 0.0117   # Minimal noise
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        ignore_opacity = false
        xray = false     # Disable for better performance
        special = true   # Blur behind special/scratchpad workspaces
        popups = true    # Keep popups blurred
    }

    # https://wiki.hyprland.org/0.45.0/Configuring/Variables/#shadow
    # Neon glow aura - active windows flash bright on focus (fadeShadow animation)
    shadow {
        enabled = true
        range = 22       # Wide glow halo for visible neon flash
        render_power = 3 # Defined glow edge
        color = $neon_pink  # Full-brightness neon pink for active (flash effect via fadeShadow)
        color_inactive = $neon_blue_dim  # Subtle blue for inactive (contrast with flash)
        offset = 0 2     # Slight downward offset for depth
        sharp = false    # Soft diffuse glow
    }
}
