# ┃                    Window Rules                           ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
#
# Updated for Hyprland 0.53+ (new windowrule / layerrule syntax)
# Reference: https://wiki.hypr.land/Configuring/Window-Rules/

# -------------------------------------------------------------
# Layer Rules (for Waybar, Quickshell bar, notifications, etc.)
# Note: Hyprland treats layerrule as a special category whose key is `name`.
# The key must appear first; using bracket syntax avoids ordering issues.
# -------------------------------------------------------------
layerrule[waybar-layer] {
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.3
    animation = slide
}

layerrule[quickshell-layer] {
    match:namespace = @quickshell-waybar-replacement
    blur = on
    ignore_alpha = 0.3
    animation = slide
}

layerrule[wlogout-layer] {
    match:namespace = wlogout
    blur = on
    ignore_alpha = 0.3
    dim_around = on
    animation = fade
    order = 10
}

# Ulauncher - glass launcher overlay
layerrule[ulauncher-layer] {
    match:namespace = ulauncher
    blur = on
    ignore_alpha = 0.3
    animation = fade
}

# swaync control center (slide-out panel) - blur is fine here
layerrule[swaync-control-center-layer] {
    match:namespace = swaync-control-center
    blur = on
    ignore_alpha = 0.3
    animation = slide
}

# swaync notification popups (top-right) - NO blur so they don't cover/blur content beneath
layerrule[swaync-notification-layer] {
    match:namespace = swaync-notification-window
    animation = slide
}

# -------------------------------------------------------------
# Global Rules
# -------------------------------------------------------------
windowrule {
    name = floating-style
    match:float = true
    border_color = $neon_pink $neon_electric $neon_purple 45deg
    animation = slide
    rounding = 12
}

windowrule {
    name = tiled-style
    match:float = false
    rounding = 6
    border_size = 4
}

# Maximized windows - optimized for performance (see fullscreen rules below)
# Note: All fullscreen/maximized windows use performance optimizations (rounding 0, border_size 0, etc.)

# -------------------------------------------------------------
# Fullscreen Optimization Rules (Fix Mouse Stuttering)
# -------------------------------------------------------------
windowrule {
    name = fullscreen-cursor
    match:class = ^(cursor)$
    match:fullscreen = true
    immediate = true
    no_blur = true
    no_shadow = true
    rounding = 0
    border_size = 0
    opacity = 1.0 override
}

windowrule {
    name = fullscreen-global
    match:fullscreen = true
    immediate = true
    no_blur = true
    no_shadow = true
    no_anim = true
    rounding = 0
    border_size = 0
    opacity = 1.0 override
}

windowrule {
    name = maximize-global
    match:fullscreen_state_internal = 1
    immediate = true
    no_blur = true
    no_shadow = true
    no_anim = true
    rounding = 0
    border_size = 0
    opacity = 1.0 override
}

windowrule {
    name = fullscreen-steam
    match:class = ^(steam_app_)(.*)$
    match:fullscreen = true
    immediate = true
    no_blur = true
    no_shadow = true
    no_anim = true
}

windowrule {
    name = fullscreen-video
    match:class = ^(mpv|vlc)$
    match:fullscreen = true
    immediate = true
    no_blur = true
    no_shadow = true
}

windowrule {
    name = fullscreen-browser-video
    match:title = ^.*(YouTube|Netflix|Twitch|Prime Video).*
    match:fullscreen = true
    immediate = true
    no_blur = true
    no_shadow = true
}

# -------------------------------------------------------------
# Modal Dialogs (catch-all for "Are you sure?" type prompts)
# 0.53 match:modal catches all modal windows across every app
# -------------------------------------------------------------
windowrule {
    name = "modal-always-float"
    match:modal = true
    float = true
    center = true
    pin = true
    stay_focused = true
    border_color = $neon_hot_pink $neon_electric 45deg
    rounding = 10
    animation = popin
    dim_around = true
}

# -------------------------------------------------------------
# Idle Inhibit (prevent screen lock during video/games)
# -------------------------------------------------------------
windowrule {
    name = "idle-inhibit-video"
    match:class = ^(mpv|vlc|celluloid)$
    idle_inhibit = focus
}

windowrule {
    name = "idle-inhibit-browser-video"
    match:title = ^.*(YouTube|Netflix|Twitch|Prime Video|Disney|Hulu).*$
    idle_inhibit = focus
}

windowrule {
    name = "idle-inhibit-games"
    match:class = ^(steam_app_)(.*)$
    idle_inhibit = always
}

