# ┃                StepheyBot NEON INTENSE Theme                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
#
# User overrides and customizations ONLY.
# Do not set theme or environment variables here—use environment.conf for those.
# This file is sourced LAST for maximum precedence.

# Neon glow bezier curves (custom user animation overrides)
bezier = neonBlast, 0.1, 1.2, 0.1, 1.2
bezier = cyberShock, 0.68, -0.55, 0.265, 1.55
bezier = synthMax, 0.23, 1.2, 0.32, 1.2
# Smooth continuous rotation for border gradient -- near-linear with slight ease
bezier = neonSpin, 0.0, 0.0, 1.0, 1.0
# Gentle breathe for border glow transitions
bezier = neonBreathe, 0.4, 0.0, 0.6, 1.0

# Intense animations (user override)
animation = windowsIn, 1, 5, cyberShock, popin 75%
animation = windowsOut, 1, 4, synthMax, slide
animation = fadeIn, 1, 8, neonBlast
animation = fadeOut, 1, 6, synthMax
# Border: smooth continuous gradient rotation (slow, fluid, no jitter)
animation = borderangle, 1, 100, neonSpin, loop
# Border color transition: gentle breathe effect when focus changes
animation = border, 1, 8, neonBreathe
animation = workspaces, 1, 6, cyberShock, slidefade 25%

# Maximum glow decorations (user override)
# PERFORMANCE NOTE: These settings are expensive - consider reducing for better fullscreen performance
decoration {
    shadow {
        range = 40
        render_power = 4
    }
    blur {
        passes = 2       # WARNING: 2 passes is expensive - consider 1 for better fullscreen performance
        size = 3         # Minimal blur for maximum readability
        vibrancy = 0.85  # WARNING: Very high vibrancy is expensive - consider 0.2-0.3 for better performance
        vibrancy_darkness = 0.7  # Increased to darken backgrounds more
        noise = 0.01     # Very subtle noise texture
        contrast = 2.0   # WARNING: Maximum contrast is expensive - consider 1.0-1.2 for better performance
        brightness = 0.90 # Lowered to darken blurred background significantly
    }
}

# Window rules are handled by named blocks in windowrules.conf

# Layer blur is now handled selectively in windowrules.conf (per-namespace layerrule blocks).
# The old blanket "blur on ^(.*)$" was removed because it blurred ALL layers including
# swaync notification popups, covering and blurring content underneath.
# Enhanced PCManFM-Qt configuration
source = /home/stephey/.config/hypr/config/pcmanfm_enhanced_fixed.conf
